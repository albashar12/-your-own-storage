{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800/60 p-8 rounded-2xl border border-slate-700 shadow-xl backdrop-blur">
    <h2 class="text-2xl font-bold mb-2 text-center text-white">Secure Sign In</h2>
    <p class="text-slate-400 text-xs text-center mb-6">Enter your credentials to access your encrypted vault.</p>
    
    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Username</label>
            <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500 transition">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg shadow-lg hover:shadow-emerald-500/20 transition">
            Access Storage
        </button>
    </form>
    
    <div class="mt-6 flex justify-between items-center text-xs text-slate-400 border-t border-slate-700/50 pt-4">
        <a href="{{ url_for('register') }}" class="hover:text-emerald-400">Create Vault Account</a>
        <a href="{{ url_for('reset_password') }}" class="hover:text-emerald-400">Forgot Password?</a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800/60 p-8 rounded-2xl border border-slate-700 shadow-xl backdrop-blur">
    <h2 class="text-2xl font-bold mb-2 text-center text-white">Create Encrypted Vault</h2>
    <p class="text-slate-400 text-xs text-center mb-6">Setup private cloud storage with high-grade security.</p>
    
    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Choose Username</label>
            <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Set Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Security Recovery Question</label>
            <input type="text" name="sec_question" placeholder="e.g. First pet's name?" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Security Answer</label>
            <input type="text" name="sec_answer" placeholder="Your secret answer" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg shadow-lg hover:shadow-emerald-500/20 transition">
            Register Vault Account
        </button>
    </form>
    
    <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-700/50 pt-4">
        Already registered? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline">Sign In</a>
    </div>
</div>
{% endblock %}

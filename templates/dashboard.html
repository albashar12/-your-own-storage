<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Own Vault - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #09090b); color: #f8fafc; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 20px 30px; border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); margin-bottom: 30px; }
        h2 { font-size: 24px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.3); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .upload-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); margin-bottom: 30px; text-align: center; }
        .file-input-wrapper { margin-bottom: 20px; }
        input[type="file"] { color: #cbd5e1; padding: 10px; background: rgba(15, 23, 42, 0.6); border: 1px dashed rgba(56, 189, 248, 0.4); border-radius: 8px; width: 100%; cursor: pointer; }
        button[type="submit"] { background: linear-gradient(135deg, #0284c7, #4f46e5); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }
        
        /* Progress Bar Styles */
        .progress-container { display: none; margin-top: 20px; width: 100%; background: rgba(15, 23, 42, 0.8); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
        .progress-bar { width: 0%; height: 22px; background: linear-gradient(90deg, #0284c7, #38bdf8); text-align: center; color: white; font-size: 12px; font-weight: 600; line-height: 22px; transition: width 0.2s ease; }
        
        .files-section h3 { margin-bottom: 15px; font-size: 20px; color: #e2e8f0; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .file-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); padding: 18px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease; }
        .file-card:hover { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); transform: translateY(-3px); }
        .thumb-container { width: 100%; height: 140px; margin-bottom: 12px; border-radius: 8px; overflow: hidden; background: rgba(0, 0, 0, 0.2); display: flex; align-items: center; justify-content: center; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .file-name { font-size: 14px; word-break: break-all; margin-bottom: 15px; color: #cbd5e1; }
        .view-btn { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; text-align: center; padding: 8px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.3s ease; }
        .view-btn:hover { background: rgba(56, 189, 248, 0.3); box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>🛡️ Your Own Vault</h2>
            <a href="/logout" class="logout-btn">Logout</a>
        </header>
        <div class="upload-card">
            <form id="uploadForm" action="/dashboard" method="POST" enctype="multipart/form-data">
                <div class="file-input-wrapper">
                    <input type="file" name="file" id="fileInput" multiple required>
                </div>
                <button type="submit" id="uploadBtn">Upload Files</button>
            </form>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
        </div>
        
        <div class="files-section">
            <h3>📂 Stored Files</h3>
            <div class="file-grid">
                {% for file in files %}
                <div class="file-card">
                    {% if file.mime_type and file.mime_type.startswith('image/') %}
                    <div class="thumb-container">
                        <img src="/view/{{ file.id }}" alt="{{ file.filename }}" class="thumb-img">
                    </div>
                    {% endif %}
                    <div class="file-name">{{ file.filename }}</div>
                    <a href="/view/{{ file.id }}" target="_blank" class="view-btn">View / Download</a>
                </div>
                {% else %}
                <p style="color: #64748b;">No files uploaded yet.</p>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const uploadBtn = document.getElementById('uploadBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;

            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            xhr.open('POST', '/dashboard', true);

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressContainer.style.display = 'block';
                    progressBar.style.width = percentComplete + '%';
                    progressBar.innerHTML = percentComplete + '% Uploading...';
                    uploadBtn.disabled = true;
                    uploadBtn.style.opacity = '0.6';
                }
            });

            xhr.onload = function() {
                if (xhr.status === 200) {
                    progressBar.innerHTML = 'Upload Complete!';
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    alert('Upload failed. Please try again.');
                    uploadBtn.disabled = false;
                    uploadBtn.style.opacity = '1';
                }
            };

            xhr.onerror = function() {
                alert('An error occurred during upload.');
                uploadBtn.disabled = false;
                uploadBtn.style.opacity = '1';
            };

            xhr.send(formData);
        });
    </script>
</body>
</html>
